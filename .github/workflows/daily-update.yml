# Runs every morning: updates the poll numbers on the site and opens a "Daily check" issue
# with what changed plus election headlines. News never changes the site by itself.
name: Daily poll update

on:
  schedule:
    - cron: "30 6 * * *"   # 06:30 UTC = 09:30 in Israel, after MEF's morning update
  workflow_dispatch:        # lets you run it by hand from the Actions tab

permissions:
  contents: write
  issues: write
  pages: write

concurrency:
  group: daily-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Update poll numbers and write report
        id: run
        run: python3 scripts/update_site.py --index index.html --report "$RUNNER_TEMP/report.md"

      - name: Commit if the numbers changed
        if: steps.run.outputs.changed == 'true'
        run: |
          git config user.name "daily-poll-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Daily poll update $(date -u +%F)"
          git push

      - name: Rebuild the live site
        if: steps.run.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || echo "Pages rebuild request failed; the next push will rebuild it."

      - name: Post the daily check issue
        if: steps.run.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create daily-check --color 0E8A16 --description "Automatic daily poll and news check" --force
          for n in $(gh issue list --label daily-check --state open --json number --jq '.[].number'); do
            gh issue close "$n" --comment "Replaced by today's check."
          done
          title="Daily check $(date -u +%F)"
          if [ "${{ steps.run.outputs.status }}" = "error" ]; then title="$title: poll update FAILED"; fi
          url=$(gh issue create --title "$title" --label daily-check --body-file "$RUNNER_TEMP/report.md")
          gh issue edit "$url" --add-assignee arikellman || echo "Could not assign; watch the repo to get these by email."
