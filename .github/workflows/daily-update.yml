# After the 27 October 2026 election:
#  - 08:00 Israel time: refresh the count, have Claude update the coalition talks section, and open a
#    "Daily check" issue with what changed plus election headlines.
#  - 13:00, 18:00 and 23:00 Israel time: refresh the vote count only (quiet: no issue)
# The coalition update signs in to the Claude API with workload identity federation: GitHub gives this
# run a short-lived identity token, and Anthropic swaps it for API access. No API key is stored anywhere.
# It needs four repository variables (Settings → Secrets and variables → Actions → Variables):
#   ANTHROPIC_FEDERATION_RULE_ID, ANTHROPIC_ORGANIZATION_ID, ANTHROPIC_SERVICE_ACCOUNT_ID, ANTHROPIC_WORKSPACE_ID
# Without them, everything else still runs and the daily issue says the coalition update was skipped.
name: Daily results and coalition update

on:
  schedule:
    # Times are UTC. Israel is UTC+2 in winter; from 26 March 2027 (summer time) each run lands an hour later.
    - cron: "0 6 * * *"          # 08:00 Israel: full morning update
    - cron: "0 11,16,21 * * *"   # 13:00, 18:00 and 23:00 Israel: vote count only
  workflow_dispatch:          # run it by hand from the Actions tab
    inputs:
      mode:
        description: "daily = count + coalition + issue, counts = count only"
        type: choice
        options: [daily, counts]
        default: daily

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write     # lets the run ask GitHub for an identity token to sign in to the Claude API

concurrency:
  group: daily-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Pick the mode
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then mode="${{ inputs.mode }}"
          elif [ "${{ github.event.schedule }}" = "0 6 * * *" ]; then mode=daily
          else mode=counts; fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"

      - name: Install the Claude SDK (morning run only)
        if: steps.mode.outputs.mode == 'daily'
        run: python3 -m pip install --quiet anthropic==2.3.0

      - name: Get an identity token for the Claude API (morning run only)
        if: steps.mode.outputs.mode == 'daily' && vars.ANTHROPIC_FEDERATION_RULE_ID != ''
        run: |
          curl -sSf -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=https://api.anthropic.com" \
            | python3 -c "import json, sys; print(json.load(sys.stdin)['value'], end='')" > "$RUNNER_TEMP/anthropic-identity.jwt"
          echo "ANTHROPIC_IDENTITY_TOKEN_FILE=$RUNNER_TEMP/anthropic-identity.jwt" >> "$GITHUB_ENV"

      - name: Update the site and write the report
        id: run
        env:
          # The Anthropic SDK finds these and does the token exchange itself. Do not also set
          # ANTHROPIC_API_KEY here: even an empty one takes priority over federation.
          ANTHROPIC_FEDERATION_RULE_ID: ${{ vars.ANTHROPIC_FEDERATION_RULE_ID }}
          ANTHROPIC_ORGANIZATION_ID: ${{ vars.ANTHROPIC_ORGANIZATION_ID }}
          ANTHROPIC_SERVICE_ACCOUNT_ID: ${{ vars.ANTHROPIC_SERVICE_ACCOUNT_ID }}
          ANTHROPIC_WORKSPACE_ID: ${{ vars.ANTHROPIC_WORKSPACE_ID }}
        run: python3 scripts/update_site.py --index index.html --mode ${{ steps.mode.outputs.mode }} --report "$RUNNER_TEMP/report.md"

      - name: Commit if anything changed
        if: steps.run.outputs.changed == 'true'
        run: |
          git config user.name "daily-update-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "${{ steps.mode.outputs.mode == 'daily' && 'Daily results and coalition update' || 'Vote count update' }} $(date -u +'%F %H:%M') UTC"
          git pull --rebase --quiet
          git push

      - name: Rebuild the live site
        if: steps.run.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || echo "Pages rebuild request failed; the next push will rebuild it."

      - name: Post the daily check issue
        if: steps.run.outputs.post_issue == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create daily-check --color 0E8A16 --description "Automatic daily results and coalition check" --force
          for n in $(gh issue list --label daily-check --state open --json number --jq '.[].number'); do
            gh issue close "$n" --comment "Replaced by today's check."
          done
          title="Daily check $(date -u +%F)"
          if [ "${{ steps.run.outputs.status }}" = "error" ]; then title="$title: something FAILED"; fi
          url=$(gh issue create --title "$title" --label daily-check --body-file "$RUNNER_TEMP/report.md")
          gh issue edit "$url" --add-assignee arikellman || echo "Could not assign; watch the repo to get these by email."
